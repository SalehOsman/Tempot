services:
  postgres:
    image: postgres:16-alpine
    container_name: tembot-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-tembot}
    volumes:
      - tembot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tembot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tembot-net

  redis:
    image: redis:7-alpine
    container_name: tembot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tembot_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tembot-net

  minio:
    image: ghcr.io/shyim/local-s3:latest
    container_name: tembot-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - S3_ACCOUNT_ADMIN=${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-miniopassword}
    volumes:
      - tembot_minio_data:/data
    networks:
      - tembot-net

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: tembot-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-tembot}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tembot-net
    profiles: ["app"]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: tembot-bot
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-tembot}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TMA_URL=${TMA_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tembot-net
    profiles: ["app"]

volumes:
  tembot_postgres_data:
  tembot_redis_data:
  tembot_minio_data:

networks:
  tembot-net:
    driver: bridge
