services:
  postgres:
    image: postgres:16-alpine
    container_name: tembot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-tembot}
    volumes:
      - tembot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tembot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tembot-net

  redis:
    image: redis:7-alpine
    container_name: tembot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tembot_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tembot-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: tembot-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword}
    volumes:
      - tembot_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - tembot-net

volumes:
  tembot_postgres_data:
  tembot_redis_data:
  tembot_minio_data:

networks:
  tembot-net:
    driver: bridge
